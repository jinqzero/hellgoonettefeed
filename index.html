<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Hellgoonette Feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --pink: #ff2e88;
        --ink: #ffffff;
        --muted: rgba(255, 255, 255, 0.62);
        --faint: rgba(255, 255, 255, 0.42);
        --line: #222222;
        --line-strong: #333333;
        --surface-2: #161616;
        --bar-track: #222222;
        --radius: 8px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #000; }
      body {
        font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      /* Scroll is locked while the gate/loader are up simply because the
         feed behind them is still empty — nothing to scroll to yet. */

      /* ---------- Header + channel menu ---------- */
      #chbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: none;
        background: #000;
        border-bottom: 1px solid var(--line);
      }
      #chbar.on { display: block; }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: 54px;
        padding: 0 14px;
      }
      .header-wordmark {
        font: 900 15px/1 "Archivo", system-ui, sans-serif;
        letter-spacing: 0.07em;
        color: #fff;
        white-space: nowrap;
      }
      .header-wordmark i, .wordmark i { font-style: normal; color: var(--pink); }
      #ch-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        max-width: 58vw;
        padding: 0 12px;
        border-radius: var(--radius);
        border: 1px solid var(--line-strong);
        background: transparent;
        color: #fff;
        font: 600 13.5px/1 "Archivo", system-ui, sans-serif;
        letter-spacing: 0.01em;
        cursor: pointer;
      }
      #ch-btn:hover { border-color: rgba(255, 255, 255, 0.55); }
      #ch-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      #ch-btn .word { color: var(--faint); font-weight: 500; }
      #ch-btn .cur { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #ch-btn svg {
        width: 16px; height: 16px;
        flex: none;
        color: rgba(255, 255, 255, 0.7);
        transition: transform 0.18s ease;
      }
      #chbar.open #ch-btn svg { transform: rotate(180deg); }
      #ch-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 12px;
        right: 12px;
        max-height: min(62vh, 520px);
        overflow-y: auto;
        padding: 6px;
        border-radius: var(--radius);
        border: 1px solid var(--line-strong);
        background: #0a0a0a;
      }
      @media (min-width: 700px) {
        #ch-menu { left: auto; right: 14px; width: 340px; }
      }
      #ch-menu[hidden] { display: none; }
      .ch-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: 500 14px/1 "Archivo", system-ui, sans-serif;
        letter-spacing: 0.01em;
        text-align: left;
        cursor: pointer;
      }
      .ch-item:hover { background: var(--surface-2); color: #fff; }
      .ch-item:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
      .ch-item.active { background: var(--surface-2); color: #fff; font-weight: 700; }
      .ch-item.active::after {
        content: "";
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--pink);
        flex: none;
      }

      /* ---------- Feed grid ---------- */
      #feed {
        column-count: 3;
        column-gap: 2px;
        padding: 0;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #feed.on { opacity: 1; }
      @media (min-width: 600px)  { #feed { column-count: 4; } }
      @media (min-width: 900px)  { #feed { column-count: 5; } }
      @media (min-width: 1200px) { #feed { column-count: 7; } }
      @media (min-width: 1800px) { #feed { column-count: 8; } }

      .tile {
        position: relative;
        margin: 0 0 2px;
        break-inside: avoid;
        overflow: hidden;
        background: #0a0a0a;
      }
      /* Media fades in once it has actually loaded. Tiles used to
         pop in the instant their bytes arrived and reshuffle the
         columns — the visible "glitch" while scrolling. No
         content-visibility here: in a multi-column layout its
         guessed intrinsic size made off-screen tiles flicker and
         jump as they were scrolled back into view. */
      .tile img, .tile video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .tile.ready img, .tile.ready video { opacity: 1; }
      .new-badge {
        position: absolute;
        left: 8px;
        bottom: 8px;
        z-index: 3;
        padding: 4px 7px;
        border-radius: 4px;
        background: var(--pink);
        color: #fff;
        font: 800 10px/1 "Archivo", system-ui, sans-serif;
        letter-spacing: 0.08em;
        pointer-events: none;
      }
      .tile.hiding { opacity: 0; transform: scale(0.96); transition: opacity 0.25s ease, transform 0.25s ease; }

      /* Failed tiles keep their slot: a dead tile that vanished
         reshuffled every column and emptied small channels. */
      .fail-overlay {
        position: absolute; inset: 0; z-index: 2;
        display: none;
        align-items: center; justify-content: center;
        padding: 10px;
      }
      .tile.failed .fail-overlay { display: flex; }
      .retry-btn {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        font: 600 12px/1 "Archivo", system-ui, sans-serif;
        cursor: pointer;
      }
      .retry-btn:hover { background: var(--pink); border-color: var(--pink); }
      .retry-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .ch-count {
        margin-left: auto;
        color: var(--faint);
        font-size: 12.5px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      /* Hover controls: Hide / Report / Pin */
      .tile .controls {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
        z-index: 3;
      }
      .tile:hover .controls, .tile:focus-within .controls { opacity: 1; pointer-events: auto; }
      .ctl {
        width: 36px; height: 36px;
        min-width: 36px; min-height: 36px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }
      .ctl svg { width: 17px; height: 17px; }
      .ctl:hover { background: var(--pink); border-color: var(--pink); }
      .ctl:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

      /* Unmute pill on videos */
      .unmute {
        position: absolute;
        right: 8px;
        bottom: 8px;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        font: 600 12px/1 "Archivo", system-ui, sans-serif;
        letter-spacing: 0.02em;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }
      .unmute svg { width: 15px; height: 15px; }
      .tile:hover .unmute, .tile:focus-within .unmute { opacity: 1; pointer-events: auto; }
      .unmute:hover { background: var(--pink); border-color: var(--pink); }
      .unmute:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

      /* ---------- Age gate ---------- */
      #gate {
        position: fixed; inset: 0; z-index: 60;
        background: #000;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
        overflow: hidden;
      }
      #gate.gone { display: none; }
      /* Her Discord server banner, full-bleed behind the gate.
         object-fit: cover on every screen — on a portrait phone the
         banner fills the whole screen like a wallpaper, its sides
         cropped to the phone's form. */
      .gate-banner {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        object-position: center;
      }
      .gate-shade {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.58) 0%, rgba(0, 0, 0, 0.42) 45%, rgba(0, 0, 0, 0.82) 100%);
      }
      .gate-box {
        position: relative; z-index: 1;
        text-align: center; max-width: 420px; width: 100%;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85), 0 1px 4px rgba(0, 0, 0, 0.9);
      }
      .wordmark {
        margin: 10px 0 0;
        font-weight: 900;
        font-size: clamp(30px, 7vw, 44px);
        letter-spacing: 0.04em;
        line-height: 1.05;
      }
      .wordmark { color: #fff; }
      .gate-sub { margin: 16px 0 0; font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.85); }
      .enter-btn {
        margin-top: 28px;
        width: 100%;
        min-height: 52px;
        border: none;
        border-radius: var(--radius);
        background: var(--pink);
        color: #fff;
        font: 800 15px/1 "Archivo", system-ui, sans-serif;
        letter-spacing: 0.05em;
        cursor: pointer;
      }
      .enter-btn:hover { background: #e02674; }
      .enter-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      .under-link {
        display: inline-block;
        margin-top: 14px;
        padding: 10px 14px;
        min-height: 36px;
        background: none;
        border: none;
        color: rgba(255,255,255,0.78);
        font: 500 14px/1 "Archivo", system-ui, sans-serif;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .under-link:hover { color: #fff; }
      #gate-denied { display: none; }
      #gate-denied p { color: rgba(255,255,255,0.85); font-size: 16px; line-height: 1.55; margin: 14px 0 0; }

      /* ---------- Loader ---------- */
      #loader {
        position: fixed; inset: 0; z-index: 50;
        background: #000;
        display: none;
      }
      #loader.on { display: block; }
      #loader.gone { opacity: 0; pointer-events: none; transition: opacity 0.55s ease; }
      .loader-brand {
        position: absolute; left: 0; right: 0; top: 38%;
        transform: translateY(-50%);
        text-align: center;
      }
      .loader-brand .wordmark { font-size: clamp(24px, 5.5vw, 34px); }
      .loader-status {
        position: absolute; left: 0; right: 0; bottom: 11vh;
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        padding: 0 24px;
      }
      .connecting { font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: 0.02em; }
      .bar {
        width: min(420px, 82vw);
        height: 3px;
        background: var(--bar-track);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar > i {
        display: block; height: 100%; width: 0%;
        background: var(--pink);
        border-radius: 2px;
        transition: width 0.25s ease;
      }
      .load-count { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; }

      /* Scroll-load chip */
      #chip {
        position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(8px);
        z-index: 40;
        background: #0a0a0a;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 14px;
        font-size: 12.5px; font-weight: 500; letter-spacing: 0.02em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
        white-space: nowrap;
      }
      #chip.on { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* ---------- Toast ---------- */
      #toast {
        position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%) translateY(10px);
        z-index: 70;
        display: flex; align-items: center; gap: 8px;
        background: #0a0a0a;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        padding: 11px 16px;
        font-size: 14px; font-weight: 600;
        opacity: 0; pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        white-space: nowrap;
      }
      #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
      #toast svg { width: 16px; height: 16px; color: var(--pink); flex: none; }

      /* ---------- Discord pill ---------- */
      #discord-pill {
        position: fixed; right: 14px; bottom: 14px; z-index: 45;
        display: inline-flex; align-items: center; gap: 8px;
        min-height: 40px;
        padding: 0 14px 0 12px;
        border-radius: var(--radius);
        background: #0a0a0a;
        border: 1px solid var(--line-strong);
        color: rgba(255, 255, 255, 0.72);
        text-decoration: none;
        font: 600 13px/1 "Archivo", system-ui, sans-serif;
        letter-spacing: 0.01em;
      }
      #discord-pill svg { width: 18px; height: 18px; color: #fff; flex: none; }
      #discord-pill:hover, #discord-pill:focus-visible { color: #fff; border-color: rgba(255, 255, 255, 0.55); }
      #discord-pill:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

      #sentinel { height: 2px; }

      /* ---------- End of feed ---------- */
      #endfeed {
        padding: 48px 24px 96px;
        text-align: center;
      }
      #endfeed[hidden] { display: none; }
      .ef-title { margin: 0; color: #fff; font-size: 15px; font-weight: 700; }
      .ef-sub { margin: 8px auto 0; max-width: 340px; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
      .ef-top {
        margin-top: 18px;
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        background: transparent;
        color: #fff;
        font: 600 13px/1 "Archivo", system-ui, sans-serif;
        cursor: pointer;
      }
      .ef-top:hover { border-color: rgba(255, 255, 255, 0.55); }
      .ef-top:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

      @media (prefers-reduced-motion: reduce) {
        #feed, .bar > i, .tile.hiding, #loader.gone, .tile img, .tile video { transition: none; }
      }
    </style>
  </head>
  <body>

    <!-- ===== 18+ gate ===== -->
    <div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
      <img class="gate-banner" src="https://cdn.discordapp.com/banners/1519374264514510898/a_4b54e8190a216d928a8c2074caa8c4c6.gif" alt="" aria-hidden="true" />
      <div class="gate-shade" aria-hidden="true"></div>
      <div class="gate-box" id="gate-main">
        <h1 class="wordmark" id="gate-title">HELL<i>GOON</i>ETTE</h1>
        <p class="gate-sub">You must be 18 or older to enter</p>
        <button class="enter-btn" id="enter-btn" type="button">I AM 18 OR OLDER</button>
        <br />
        <button class="under-link" id="under-btn" type="button">I'm under 18</button>
      </div>
      <div class="gate-box" id="gate-denied">
        <p>Sorry — this feed is for adults only.<br />Come back when you're 18.</p>
        <button class="under-link" id="back-btn" type="button">Back</button>
      </div>
    </div>

    <!-- ===== Loader ===== -->
    <div id="loader" aria-hidden="true">
      <div class="loader-brand">
        <div class="wordmark">HELL<i>GOON</i>ETTE</div>
      </div>
      <div class="loader-status">
        <div class="connecting">Connecting…</div>
        <div class="bar"><i id="bar-fill"></i></div>
        <div class="load-count" id="load-count">Loading media…</div>
      </div>
    </div>

    <!-- ===== Channel menu ===== -->
    <div id="chbar">
      <div class="header-inner">
        <span class="header-wordmark">HELL<i>GOON</i>ETTE</span>
        <button id="ch-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="ch-menu">
          <span class="word">Channels</span>
          <span class="cur" id="ch-btn-cur">Stream Feed</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div id="ch-menu" role="menu" aria-label="Choose a channel" hidden></div>
    </div>

    <!-- ===== Feed ===== -->
    <main id="feed" aria-label="Hellgoonette media feed"></main>
    <div id="endfeed" hidden>
      <p class="ef-title" id="ef-title">You're all caught up</p>
      <p class="ef-sub" id="ef-sub">Every post in this channel, newest first — nothing repeats.</p>
      <button class="ef-top" id="ef-top" type="button">Back to the newest posts</button>
    </div>
    <div id="sentinel" aria-hidden="true"></div>

    <div id="chip" role="status"></div>

    <div id="toast" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span>Thanks — we'll review it</span>
    </div>

    <a id="discord-pill" href="https://discord.gg/hellgoonette" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03ZM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/></svg>
      discord.gg/hellgoonette
    </a>

    <script>
      "use strict";

      /* ============================================================
         MEDIA LIST — every tile in the feed lives here.
         129 items pulled from Hellgoonette's Discord server on
         2026-11-26, each tagged with its channel (c) and type
         (t: "v" = video, "i" = image/GIF). Display order is not
         the order below: at runtime every item is sorted newest
         first by the Discord snowflake (message ID) in its URL —
         globally for the Stream Feed and within each channel.
         Hot-linked from Discord's CDN; w/h set the tile's aspect
         ratio up front and are never changed after the tile is
         placed (changing them on load reshuffled every column —
         the old glitch). A tile whose media fails is retried
         twice, then keeps its slot with a tap-to-retry button:
         Discord's signed links expire, and tiles that silently
         vanished made whole channels look empty. The list is
         deduped by attachment ID at startup, so a post pasted
         in twice can never render twice. The feed is finite —
         each item renders exactly once, newest first, and
         scrolling ends at an end-of-feed note instead of
         looping back to the top.
         ============================================================ */
      const MEDIA = [
        { c: "goonfeed", t: "v", src: "https://cdn.discordapp.com/attachments/1522319683561193502/1575606027175465042/lexieeegal-2124907578559696918-01.mp4?ex=6b09e4f6&is=6b089376&hm=6da10a21dccd8c26737ecbd1974fb0d14a2905eaf0885321b3eadec8cf7bf62d&", w: 9, h: 16 },

      /* ---------- newest-first ordering ----------
         The second ID in each Discord attachment URL is the
         message snowflake: bigger = posted later. Sorting by it
         descending puts the latest posts first — globally across
         all channels for the Stream Feed, and (because filtering
         a sorted list preserves order) inside every channel too.
         Items whose URL carries no snowflake sort last. */
      function snowflakeOf(item) {
        const m = /\/attachments\/\d+\/(\d+)\//.exec(item.src);
        return m ? BigInt(m[1]) : 0n;

          tile.appendChild(unmuteBtn);
          videoObserver.observe(mediaEl);
          videoLazyObserver.observe(mediaEl);
        }
        return tile;
      }

      function loadBatch() {
        if (!sourceList.length) { showEnd(); return; }
        if (exhausted) return;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < BATCH; i++) {
          const item = nextItem();
          if (!item) break;
          const rank = renderedCount++;
          // The newest posts in each view carry a NEW badge so fresh
          // content reads as fresh instead of blending into the grid.
          frag.appendChild(buildTile(item, rank < (currentChannel === "all" ? 12 : 5)));
        }
        feed.appendChild(frag);
        updateProgress();
        if (exhausted) showEnd();
      }

      /* ---------- infinite scroll ---------- */
      // The old code loaded exactly one batch per IntersectionObserver
      // callback. IO only reports CHANGES, so when an appended batch
      // left the sentinel still inside the 800px preload zone (short
      // batches on a phone), no new callback ever fired and the feed
      // stalled with items unloaded. Now every trigger runs a pump
      // that keeps loading batches while the sentinel is in the zone,
      // and plain scroll/resize events re-run the pump as a fallback,
      // so the first pass always runs to the end of the list.
      let sentinelObserver = null;
      let pumpQueued = false;
      function sentinelNear() {
        return sentinel.getBoundingClientRect().top < window.innerHeight + 800;
      }
      function pump() {
        if (!firstBatchDone || exhausted) return;
        let guard = 0;
        // At most a few batches per pump: flooding the DOM with
        // hundreds of tiles in one frame was part of the jank.
        while (sentinelNear() && guard < 4 && !exhausted) {
          loadBatch();
          guard++;
        }
      }
      function queuePump() {
        if (pumpQueued) return;
        pumpQueued = true;
        requestAnimationFrame(() => { pumpQueued = false; pump(); });
      }
      function observeSentinel() {
        if (sentinelObserver) return;
        sentinelObserver = new IntersectionObserver((entries) => {
          if (entries.some((e) => e.isIntersecting)) { loadBatch(); queuePump(); }
        }, { rootMargin: "800px 0px" });
        sentinelObserver.observe(sentinel);
        window.addEventListener("scroll", queuePump, { passive: true });
        window.addEventListener("resize", queuePump);
        queuePump();
      }

      /* ---------- channel menu ---------- */
      function syncChannelButton() {
        const ch = CHANNELS.find((c) => c.key === currentChannel);
        chBtnCur.textContent = ch ? ch.label : "Stream Feed";
      }

      function openMenu() {
        chMenu.hidden = false;
        chBar.classList.add("open");
        chBtn.setAttribute("aria-expanded", "true");
      }
      function closeMenu() {
        chMenu.hidden = true;
        chBar.classList.remove("open");
        chBtn.setAttribute("aria-expanded", "false");
      }

      function buildChannelMenu() {
        CHANNELS.forEach((ch) => {
          const btn = document.createElement("button");
          btn.className = "ch-item" + (ch.key === currentChannel ? " active" : "");
          btn.type = "button";
          btn.dataset.channel = ch.key;
          btn.setAttribute("role", "menuitemradio");
          btn.setAttribute("aria-checked", ch.key === currentChannel ? "true" : "false");
          btn.textContent = ch.label;
          // Every channel is listed with its real post count, so
          // the full set of channels (and what each one holds) is
          // visible at a glance.
          const count = document.createElement("span");
          count.className = "ch-count";
          count.textContent = ch.key === "all"
            ? String(UNIQUE_MEDIA.length)
            : String(UNIQUE_MEDIA.filter((m) => m.c === ch.key).length);
          btn.appendChild(count);
          btn.addEventListener("click", () => { setChannel(ch.key); closeMenu(); });
          chMenu.appendChild(btn);
        });
        syncChannelButton();
        chBtn.addEventListener("click", () => { chMenu.hidden ? openMenu() : closeMenu(); });
        document.addEventListener("click", (e) => {
          if (!chMenu.hidden && !chBar.contains(e.target)) closeMenu();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !chMenu.hidden) { closeMenu(); chBtn.focus(); }
        });
      }

      function setChannel(key) {
        if (key === currentChannel && entered) return;
        currentChannel = key;
        generation++;
        chMenu.querySelectorAll(".ch-item").forEach((b) => {
          const active = b.dataset.channel === key;
          b.classList.toggle("active", active);
          b.setAttribute("aria-checked", active ? "true" : "false");
        });
        syncChannelButton();
        // Stop and drop the old channel's tiles (videos included).
        feed.querySelectorAll("video").forEach((v) => { v.pause(); videoObserver.unobserve(v); videoLazyObserver.unobserve(v); visibleVideos.delete(v); });
        feed.innerHTML = "";
        endfeed.hidden = true;
        sourceList = key === "all" ? UNIQUE_MEDIA.slice() : UNIQUE_MEDIA.filter((m) => m.c === key);
        channelTotal = sourceList.length;
        loadedCount = 0;
        renderedCount = 0;
        refillQueue();
        chip.classList.remove("on");
        updateProgress();
        loadBatch();
        window.scrollTo(0, 0);
        queuePump();
      }

      /* ---------- gate ---------- */
      document.getElementById("enter-btn").addEventListener("click", () => {
        if (entered) return;
        entered = true; // remembered for this visit, so the gate shows once
        gate.classList.add("gone");
        loader.classList.add("on");
        loadBatch();
        // If the first batch somehow stalls, still open the feed.
        setTimeout(finishLoading, 6000);
      });
      document.getElementById("under-btn").addEventListener("click", () => {
        document.getElementById("gate-main").style.display = "none";
        document.getElementById("gate-denied").style.display = "block";
      });
      document.getElementById("back-btn").addEventListener("click", () => {
        document.getElementById("gate-denied").style.display = "none";
        document.getElementById("gate-main").style.display = "block";
      });

      buildChannelMenu();
      refillQueue();
      updateProgress();
    </script>
  <script>
(function(){var cur=null;function show(){if(document.getElementById('update-pill'))return;var b=document.createElement('button');b.id='update-pill';b.textContent='New posts \u2014 tap to refresh';b.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;background:#ff2e88;color:#fff;border:0;border-radius:999px;padding:10px 18px;font:600 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 24px rgba(0,0,0,.5)';b.onclick=function(){location.reload()};document.body.appendChild(b)}function check(){fetch('version.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(cur===null){cur=d.v;return}if(d.v!==cur){show()}}).catch(function(){})}setTimeout(check,30000);setInterval(check,300000);})();
</script>
</body>
